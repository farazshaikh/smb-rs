[package]
name = "rustsmb-meta"
description = "Workspace meta-package for the smb-server-rs project"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = ["lib"]
lib = ["smb-server/lib"]
handrolled = ["smb-server/handrolled"]

[dependencies]
smb-server = { path = "crates/smb-server", default-features = false }

[lints]
workspace = true

[workspace]
resolver = "2"
exclude = ["lints"]
members = [
    "crates/smb-server-proto",
    "crates/smb-server-proto-smb2",
    "crates/smb-server-proto-smb3",
    "crates/smb-server-proto-smb1",
    "crates/smb-server-transport",
    "crates/smb-server-vfs",
    "crates/smb-server-backend-posix",
    "crates/smb-server-auth",
    "crates/smb-server-csp",
    "crates/smb-server",
    "crates/smb-server-handle-store",
    "crates/smb-server-testsuite",
    "crates/smb-server-test-dashboard",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/farazshaikh/smb-server-rs"
homepage = "https://farazshaikh.github.io/smb-server-rs/"
keywords = ["smb", "cifs", "server", "protocol"]
categories = ["network-programming", "filesystem"]

# Workspace-wide lints. Crates opt in with `[lints]\nworkspace = true`.
# Public items must be documented — an undocumented `pub` item is a hard error.
[workspace.lints.rust]
missing_docs = "deny"
# Allow `#[cfg_attr(dylint_lib = "...", allow(...))]` to suppress dylint lints
# (e.g. no_magic_numbers on inherent-math fns) without an unexpected-cfg warning.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dylint_lib, values(any()))"] }

# Custom dylint lints (run via `cargo dylint --all`). The no_magic_numbers lint
# flags integer literals that should be named constants in the smb-server-proto* crates.
[workspace.metadata.dylint]
libraries = [
    { path = "lints/no_magic_numbers" },
]

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "io-util", "sync", "macros", "time"] }
tokio-uring = "0.5"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
clap = { version = "4", features = ["derive"] }
inotify = "0.11"
futures-util = "0.3"
# Windows security-descriptor (MS-DTYP) marshalling — pure-Rust, no FFI.
win-sd = "0.2"
# Portable extended-attribute access for persisting NT ACLs on POSIX files.
xattr = "1"
# LZNT1 compression codec for SMB3 compressed transforms (pure Rust).
lznt1 = "0.1"
# Plain LZ77 (LZXpress, [MS-XCA]) codec for SMB3 compressed transforms.
xpress_rs = "0.2"
# Enumerate local network interfaces for multichannel interface discovery.
if-addrs = "0.13"

[profile.release]
opt-level = 2
