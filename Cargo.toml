[package]
name = "rustsmb-meta"
description = "Workspace meta-package for the smb-rs project"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["lib"]
lib = ["smb-server/lib"]
handrolled = ["smb-server/handrolled"]

[dependencies]
smb-server = { path = "crates/smb-server", default-features = false }

[workspace]
resolver = "2"
members = [
    "crates/smb-proto",
    "crates/smb-proto-smb2",
    "crates/smb-proto-smb3",
    "crates/smb-proto-smb1",
    "crates/smb-transport",
    "crates/smb-vfs",
    "crates/smb-backend-posix",
    "crates/smb-auth",
    "crates/smb-csp",
    "crates/smb-server",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "io-util", "sync", "macros", "time"] }
tokio-uring = "0.5"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
clap = { version = "4", features = ["derive"] }
inotify = "0.11"
futures-util = "0.3"
# Windows security-descriptor (MS-DTYP) marshalling — pure-Rust, no FFI.
win-sd = "0.2"
# Portable extended-attribute access for persisting NT ACLs on POSIX files.
xattr = "1"
# LZNT1 compression codec for SMB3 compressed transforms (pure Rust).
lznt1 = "0.1"

[profile.release]
opt-level = 2
