name: Deploy GitHub Pages

# Builds the workspace's rustdoc API reference and the static landing page
# under site/, and publishes them to GitHub Pages. Requires Settings > Pages
# > Source = "GitHub Actions" (one-time repo setting).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo doc
        run: cargo doc --workspace --no-deps

      - name: assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r target/doc/. _site/
          cp site/index.html _site/index.html
          cp test_status.csv _site/test_status.csv
          mkdir -p _site/assets
          cp assets/mascot.png _site/assets/mascot.png
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
