[package]
name = "smb-auth"
description = "SMB authentication primitives: NTLMSSP messages, SPNEGO wrapping, NTLMv1/v2 verification via the smb-csp crypto service provider"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["lib"]
# RustCrypto crates (production default).
lib = ["smb-csp/lib"]
# Bundled hand-rolled implementations (zero external deps).
handrolled = ["smb-csp/handrolled"]

[dependencies]
smb-proto = { path = "../smb-proto" }
smb-csp = { path = "../smb-csp", default-features = false }

[lints]
workspace = true
