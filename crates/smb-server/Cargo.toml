[package]
name = "smb-server"
description = "rustsmb — high-performance SMB1/2/3 file server binary wiring transport, protocol and POSIX backend"
edition.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"

[[bin]]
name = "rustsmb"
path = "src/main.rs"

[features]
default = ["lib"]
lib = ["smb-server-auth/lib"]
handrolled = ["smb-server-auth/handrolled"]

[dependencies]
async-trait.workspace = true
tokio.workspace = true
tokio-uring.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
clap.workspace = true
smb-server-proto = { path = "../smb-server-proto" }
smb-server-proto-smb2 = { path = "../smb-server-proto-smb2" }
smb-server-proto-smb1 = { path = "../smb-server-proto-smb1" }
smb-server-transport = { path = "../smb-server-transport" }
smb-server-vfs = { path = "../smb-server-vfs" }
smb-server-backend-posix = { path = "../smb-server-backend-posix" }
smb-server-auth = { path = "../smb-server-auth", default-features = false }
smb-server-handle-store = { path = "../smb-server-handle-store" }
ms-ndr = "0.1.1"
inotify.workspace = true
futures-util.workspace = true
win-sd.workspace = true
if-addrs.workspace = true

[lints]
workspace = true
