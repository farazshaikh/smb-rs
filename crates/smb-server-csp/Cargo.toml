[package]
name = "smb-server-csp"
description = "Crypto service provider for smb-server-rs: dispatches between maintained RustCrypto crates and the bundled hand-rolled implementations"
edition.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"

[features]
default = ["lib"]
# Production backend: RustCrypto crates (hardware-accelerated where available).
lib = ["dep:cipher", "dep:digest", "dep:typenum", "dep:aead", "dep:aes-gcm", "dep:ccm", "dep:md4", "dep:md-5", "dep:sha2", "dep:hmac", "dep:des", "dep:aes", "dep:cmac", "dep:rc4"]
# Bundled hand-rolled implementations (zero external dependencies).
handrolled = []

[dependencies]
md4 = { version = "0.11", optional = true }
md-5 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
des = { version = "0.9", optional = true }
aes = { version = "0.9", optional = true }
cmac = { version = "0.8", optional = true }
rc4 = { version = "0.1", optional = true }
aes-gcm = { version = "0.11", optional = true }
ccm = { version = "0.6", optional = true }
cipher = { version = "0.5", default-features = false, optional = true }
aead = { version = "0.6", default-features = false, optional = true }
digest = { version = "0.11", default-features = false, optional = true }
typenum = { version = "1", default-features = false, optional = true }

[lints]
workspace = true
