[package]
name = "smb-server-handle-store"
description = "Pluggable durable/persistent SMB handle store with local and replicated backends"
edition.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["redb-backend"]
# Local single-node durable backend (embedded, pure Rust).
redb-backend = ["dep:redb"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = { version = "2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
