[package]
name = "smb-server-auth"
description = "SMB authentication primitives: NTLMSSP messages, SPNEGO wrapping, NTLMv1/v2 verification via the smb-server-csp crypto service provider"
edition.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"

[features]
default = ["lib"]
# RustCrypto crates (production default).
lib = ["smb-server-csp/lib"]
# Bundled hand-rolled implementations (zero external deps).
handrolled = ["smb-server-csp/handrolled"]

[dependencies]
smb-server-proto = { path = "../smb-server-proto" }
smb-server-csp = { path = "../smb-server-csp", default-features = false }

[lints]
workspace = true
