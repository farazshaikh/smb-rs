[package]
name = "smb-testsuite"
description = "Conformance/interoperability test harness for the smb-rs server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "smb-testrunner"
path = "src/bin/run.rs"
