[package]
name = "smb-testsuite"
description = "Conformance/interoperability test harness for the smb-server-rs server"
edition.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "smb-testrunner"
path = "src/bin/run.rs"

[lints]
workspace = true
